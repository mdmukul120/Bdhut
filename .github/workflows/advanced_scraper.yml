name: Advanced FootfyTV Stream Engine

on:
  schedule:
    - cron: '0 */4 * * *' # প্রতি ৪ ঘণ্টা পর পর স্বয়ংক্রিয়ভাবে চলবে
  workflow_dispatch:      # ম্যানুয়ালি রান করার জন্য অপশন

jobs:
  run-advanced-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps

      - name: Execute Advanced Scraper Engine
        run: python advanced_scraper.py

      - name: Validate and Commit Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add advanced_links.json
          
          # ফাইল পরিবর্তন হলে তবেই commit করবে
          if git status --porcelain | grep -q "advanced_links.json"; then
            git commit -m "Automated Stream Link Extraction [skip ci]"
            git push
          else
            echo "No new stream links found. Skipping commit."
          fi
